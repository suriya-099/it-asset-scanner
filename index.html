<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>IT Asset Barcode Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family: Arial, sans-serif;

      margin: 0;

      background: #f3f4f6;

      color: #111827;

    }


    .header {

      background: #1f2937;

      color: white;

      padding: 16px 20px;

      font-size: 20px;

      font-weight: bold;

    }


    .container {

      max-width: 500px;

      margin: auto;

      padding: 20px;

    }


    .card {

      background: white;

      padding: 20px;

      border-radius: 12px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.08);

    }


    #reader {

      width: 100%;

      margin-top: 15px;

      overflow: hidden;

      border-radius: 8px;

    }


    #result {

      margin-top: 15px;

      padding: 12px;

      background: #f3f4f6;

      border-radius: 8px;

      word-break: break-word;

      line-height: 1.5;

    }


    #cameraList {

      width: 100%;

      padding: 10px;

      margin-top: 10px;

      border:
        1px solid #ccc;

      border-radius: 6px;

      background: white;

      font-size: 14px;

    }


    button {

      width: 100%;

      margin-top: 15px;

      padding: 12px;

      border: none;

      border-radius: 8px;

      background: #374151;

      color: white;

      font-weight: bold;

      cursor: pointer;

      font-size: 14px;

    }


    button:active {

      transform: scale(.99);

    }


    .success {

      color: green;

      font-weight: bold;

    }


    .error {

      color: red;

      font-weight: bold;

    }


    .info {

      color: #555;

    }

  </style>

</head>


<body>


<div class="header">

  📷 IT Asset Barcode Scanner

</div>


<div class="container">


  <div class="card">


    <p>

      Pilih kamera, kemudian arahkan
      ke barcode Asset Tag.

    </p>


    <select id="cameraList">

      <option value="">
        Mendeteksi kamera...
      </option>

    </select>


    <div id="reader"></div>


    <div id="result">

      Menyiapkan kamera...

    </div>


    <button
      type="button"
      onclick="goBack()">

      ← Kembali

    </button>


  </div>


</div>


<script>


// =====================================================
// GLOBAL
// =====================================================

let scanner = null;

let alreadyScanned = false;

let currentCameraId = null;


// =====================================================
// GET MODE
// =====================================================

function getMode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("mode") ||
    "add"
  );

}


// =====================================================
// GET RETURN URL
// =====================================================

function getReturnUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("return");

}


// =====================================================
// VALIDATE RETURN URL
// =====================================================

function isAllowedReturnUrl(url) {

  if (!url) {

    return false;

  }


  try {

    const parsed =
      new URL(url);


    // Hanya izinkan HTTPS
    if (
      parsed.protocol !==
      "https:"
    ) {

      return false;

    }


    // Apps Script Web App
    if (
      parsed.hostname ===
      "script.google.com"
    ) {

      return true;

    }


    // Apps Script alternate domain
    if (
      parsed.hostname ===
      "script.googleusercontent.com"
    ) {

      return true;

    }


    return false;

  }

  catch (error) {

    return false;

  }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// SEND BARCODE TO APPS SCRIPT
// =====================================================

function sendBarcodeToParent(
  barcode
) {

  const mode =
    getMode();


  // ===============================================
  // METHOD 1
  // window.opener
  // ===============================================

  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.opener.postMessage(

        {
          type:
            "ASSET_BARCODE",

          barcode:
            barcode,

          mode:
            mode

        },

        "*"

      );


      document.getElementById(
        "result"
      ).innerHTML =

        '<span class="success">' +

        '✓ Barcode terbaca: ' +

        escapeHtml(
          barcode
        ) +

        '<br>✓ Barcode dikirim ke aplikasi.'

        + '</span>';


      // Stop kamera
      stopScanner();


      // Tutup scanner
      setTimeout(
        function() {

          window.close();

        },
        800
      );


      return true;

    }

    catch (error) {

      console.log(
        "postMessage error:",
        error
      );

    }

  }


  // ===============================================
  // METHOD 2
  // FALLBACK RETURN URL
  // ===============================================

  const returnUrl =
    getReturnUrl();


  if (
    returnUrl &&
    isAllowedReturnUrl(
      returnUrl
    )
  ) {

    try {

      const url =
        new URL(
          returnUrl
        );


      url.searchParams.set(
        "barcode",
        barcode
      );


      url.searchParams.set(
        "mode",
        mode
      );


      document.getElementById(
        "result"
      ).innerHTML =

        '<span class="success">' +

        '✓ Barcode terbaca: ' +

        escapeHtml(
          barcode
        ) +

        '<br>✓ Kembali ke aplikasi...'

        + '</span>';


      stopScanner();


      setTimeout(
        function() {

          window.location.replace(
            url.toString()
          );

        },
        500
      );


      return true;

    }

    catch (error) {

      console.log(
        "Return URL error:",
        error
      );

    }

  }


  // ===============================================
  // FAILED
  // ===============================================

  document.getElementById(
    "result"
  ).innerHTML =

    '<span class="error">' +

    '❌ Barcode berhasil dibaca, tetapi ' +

    'halaman aplikasi utama tidak ditemukan.' +

    '<br><br>' +

    'Silakan buka scanner melalui tombol ' +

    '📷 Scan pada aplikasi IT Asset Inventory.'

    + '</span>';


  return false;

}


// =====================================================
// LOAD CAMERAS
// =====================================================

function loadCameras() {

  const result =
    document.getElementById(
      "result"
    );


  result.innerText =
    "Meminta izin kamera...";


  Html5Qrcode.getCameras()

    .then(
      function(cameras) {

        const cameraList =
          document.getElementById(
            "cameraList"
          );


        cameraList.innerHTML = "";


        // ============================================
        // NO CAMERA
        // ============================================

        if (
          !cameras ||
          cameras.length === 0
        ) {

          result.innerHTML =

            '<span class="error">' +

            '❌ Tidak ada kamera yang terdeteksi.'

            + '</span>';

          return;

        }


        // ============================================
        // CAMERA LIST
        // ============================================

        cameras.forEach(
          function(
            camera,
            index
          ) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              camera.id;


            option.textContent =

              camera.label ||

              "Camera " +
              (index + 1);


            cameraList.appendChild(
              option
            );

          }
        );


        // ============================================
        // FIND BACK CAMERA
        // ============================================

        let selectedCamera =
          cameras.find(
            function(camera) {

              const label =
                String(
                  camera.label || ""
                ).toLowerCase();


              return (

                label.includes(
                  "back"
                ) ||

                label.includes(
                  "rear"
                ) ||

                label.includes(
                  "environment"
                ) ||

                label.includes(
                  "belakang"
                )

              );

            }
          );


        // ============================================
        // DEFAULT CAMERA
        // ============================================

        if (
          !selectedCamera
        ) {

          selectedCamera =
            cameras.length > 1
              ? cameras[
                  cameras.length - 1
                ]
              : cameras[0];

        }


        currentCameraId =
          selectedCamera.id;


        cameraList.value =
          selectedCamera.id;


        // ============================================
        // START SCANNER
        // ============================================

        startScanner(
          selectedCamera.id
        );

      }
    )


    .catch(
      function(error) {

        result.innerHTML =

          '<span class="error">' +

          '❌ Tidak dapat mengakses kamera: ' +

          escapeHtml(
            error
          ) +

          '</span>';

      }
    );

}


// =====================================================
// START SCANNER
// =====================================================

function startScanner(
  cameraId
) {

  if (!cameraId) {

    document.getElementById(
      "result"
    ).innerHTML =

      '<span class="error">' +

      'Camera ID tidak ditemukan.'

      + '</span>';

    return;

  }


  // Jika scanner lama masih ada
  if (scanner) {

    scanner.stop()

      .then(
        function() {

          scanner.clear();

          createScanner(
            cameraId
          );

        }
      )

      .catch(
        function() {

          createScanner(
            cameraId
          );

        }
      );

  }

  else {

    createScanner(
      cameraId
    );

  }

}


// =====================================================
// CREATE SCANNER
// =====================================================

function createScanner(
  cameraId
) {

  alreadyScanned =
    false;


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 140

    }

  };


  document.getElementById(
    "result"
  ).innerText =

    "Arahkan kamera ke barcode Asset Tag.";


  scanner.start(

    cameraId,

    config,


    // ==============================================
    // SUCCESS
    // ==============================================

    function(decodedText) {

      if (
        alreadyScanned
      ) {

        return;

      }


      alreadyScanned =
        true;


      console.log(
        "Barcode:",
        decodedText
      );


      sendBarcodeToParent(
        decodedText
      );

    },


    // ==============================================
    // SCAN ERROR
    // ==============================================

    function(errorMessage) {

      // Jangan tampilkan error scan biasa

    }

  )


  .catch(
    function(error) {

      document.getElementById(
        "result"
      ).innerHTML =

        '<span class="error">' +

        '❌ Gagal menjalankan kamera: ' +

        escapeHtml(
          error
        ) +

        '</span>';

    }
  );

}


// =====================================================
// STOP SCANNER
// =====================================================

function stopScanner() {

  if (!scanner) {

    return;

  }


  try {

    scanner.stop()

      .then(
        function() {

          scanner.clear();

        }
      )

      .catch(
        function(error) {

          console.log(
            "Stop scanner:",
            error
          );

        }
      );

  }

  catch (error) {

    console.log(
      "Stop scanner error:",
      error
    );

  }

}


// =====================================================
// CAMERA CHANGE
// =====================================================

document
  .getElementById(
    "cameraList"
  )
  .addEventListener(
    "change",
    function() {

      currentCameraId =
        this.value;


      startScanner(
        currentCameraId
      );

    }
  );


// =====================================================
// BACK
// =====================================================

function goBack() {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

    return;

  }


  const returnUrl =
    getReturnUrl();


  if (
    returnUrl &&
    isAllowedReturnUrl(
      returnUrl
    )
  ) {

    window.location.replace(
      returnUrl
    );

    return;

  }


  window.history.back();

}


// =====================================================
// START APPLICATION
// =====================================================

window.onload =
  function() {

    loadCameras();

  };


</script>


</body>

</html>
