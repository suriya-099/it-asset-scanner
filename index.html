<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>IT Asset Barcode Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      word-break: break-word;
    }

    #cameraList {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      display: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .info {
      color: #555;
    }

  </style>
</head>

<body>

<div class="header">
  📷 IT Asset Barcode Scanner
</div>

<div class="container">

  <div class="card">

    <p>
      Pilih kamera, kemudian arahkan ke barcode Asset Tag.
    </p>

    <select id="cameraList">
      <option value="">Memuat kamera...</option>
    </select>

    <div id="reader"></div>

    <div id="result">
      Menyiapkan kamera...
    </div>

    <button onclick="goBack()">
      ← Kembali
    </button>

  </div>

</div>

<script>

let scanner = null;
let alreadyScanned = false;
let currentCameraId = null;


// =======================================
// GET RETURN URL
// =======================================

function getReturnUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("return");
}


// =======================================
// GET MODE
// =======================================

function getMode() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("mode") || "";
}


// =======================================
// CHECK RETURN URL
// =======================================

function isAllowedReturnUrl(url) {

  try {

    const parsed =
      new URL(url);

    return (
      parsed.protocol === "https:" &&
      (
        parsed.hostname === "script.google.com" ||
        parsed.hostname === "script.googleusercontent.com"
      )
    );

  } catch (error) {

    return false;

  }

}


// =======================================
// RETURN TO APPS SCRIPT
// =======================================

function returnToApp(barcode) {

  const returnUrl =
    getReturnUrl();

  const mode =
    getMode();

  if (!returnUrl) {

    document.getElementById("result").innerHTML =
      '<span class="error">' +
      'Return URL tidak ditemukan.' +
      '</span>';

    return;
  }

  if (!isAllowedReturnUrl(returnUrl)) {

    document.getElementById("result").innerHTML =
      '<span class="error">' +
      'Return URL tidak diizinkan.' +
      '</span>';

    return;
  }

  try {

    const url =
      new URL(returnUrl);

    url.searchParams.set(
      "barcode",
      barcode
    );

    if (mode) {

      url.searchParams.set(
        "mode",
        mode
      );

    }

    window.location.replace(
      url.toString()
    );

  } catch (error) {

    document.getElementById("result").innerHTML =
      '<span class="error">' +
      'Gagal kembali ke aplikasi.' +
      '</span>';

  }

}


// =======================================
// LOAD CAMERAS
// =======================================

function loadCameras() {

  document.getElementById("result").innerHTML =
    "Meminta izin kamera...";

  Html5Qrcode.getCameras()

    .then(function(cameras) {

      const cameraList =
        document.getElementById(
          "cameraList"
        );

      cameraList.innerHTML = "";

      if (
        !cameras ||
        cameras.length === 0
      ) {

        document.getElementById("result").innerHTML =
          '<span class="error">' +
          'Tidak ada kamera yang terdeteksi.' +
          '</span>';

        return;

      }


      // Tampilkan daftar kamera
      cameras.forEach(function(camera, index) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          "Camera " + (index + 1);

        cameraList.appendChild(
          option
        );

      });


      cameraList.style.display =
        "block";


      // Cari kamera belakang
      let selectedCamera =
        cameras.find(function(camera) {

          const label =
            (camera.label || "")
              .toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("belakang")
          );

        });


      // Jika tidak ditemukan,
      // gunakan kamera terakhir / pertama
      if (!selectedCamera) {

        selectedCamera =
          cameras.length > 1
            ? cameras[cameras.length - 1]
            : cameras[0];

      }


      cameraList.value =
        selectedCamera.id;

      currentCameraId =
        selectedCamera.id;


      startScanner(
        currentCameraId
      );

    })

    .catch(function(error) {

      document.getElementById("result").innerHTML =
        '<span class="error">' +
        'Tidak dapat mengakses kamera: ' +
        escapeHtml(error) +
        '</span>';

    });

}


// =======================================
// START SCANNER
// =======================================

function startScanner(cameraId) {

  if (!cameraId) {

    document.getElementById("result").innerHTML =
      '<span class="error">' +
      'Camera ID tidak ditemukan.' +
      '</span>';

    return;

  }


  // Jika scanner sedang berjalan,
  // hentikan dulu
  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        createScanner(
          cameraId
        );

      })
      .catch(function() {

        createScanner(
          cameraId
        );

      });

  } else {

    createScanner(
      cameraId
    );

  }

}


// =======================================
// CREATE SCANNER
// =======================================

function createScanner(cameraId) {

  alreadyScanned = false;

  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {

      width: 280,

      height: 140

    }

  };


  document.getElementById("result").innerHTML =
    "Arahkan kamera ke barcode Asset Tag.";


  scanner.start(

    cameraId,

    config,

    function(decodedText) {

      if (alreadyScanned) {
        return;
      }

      alreadyScanned = true;


      document.getElementById("result").innerHTML =
        '<span class="success">' +
        '✓ Barcode terbaca: ' +
        escapeHtml(decodedText) +
        '</span>';


      scanner.stop()

        .then(function() {

          scanner.clear();

          returnToApp(
            decodedText
          );

        })

        .catch(function() {

          returnToApp(
            decodedText
          );

        });

    },

    function(errorMessage) {

      // Abaikan error scanning biasa

    }

  )

  .catch(function(error) {

    document.getElementById("result").innerHTML =
      '<span class="error">' +
      'Gagal menjalankan kamera: ' +
      escapeHtml(error) +
      '</span>';

  });

}


// =======================================
// CAMERA CHANGE
// =======================================

document
  .getElementById("cameraList")
  .addEventListener(
    "change",
    function() {

      const newCameraId =
        this.value;

      currentCameraId =
        newCameraId;

      startScanner(
        newCameraId
      );

    }
  );


// =======================================
// BACK
// =======================================

function goBack() {

  const returnUrl =
    getReturnUrl();

  if (
    returnUrl &&
    isAllowedReturnUrl(
      returnUrl
    )
  ) {

    window.location.replace(
      returnUrl
    );

  } else {

    window.history.back();

  }

}


// =======================================
// ESCAPE HTML
// =======================================

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =======================================
// START
// =======================================

window.onload =
  function() {

    loadCameras();

  };

</script>

</body>
</html>
