<!DOCTYPE html>
<html lang="id">
<head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Scanner</title><script src="https://unpkg.com/html5-qrcode"></script>
<style>body{font-family:Arial;background:#111827;color:#fff;margin:0;padding:15px}.box{max-width:600px;margin:auto;background:#1f2937;padding:14px;border-radius:8px}#reader{width:100%}#result{margin-top:10px;padding:10px;background:#374151;border-radius:5px;word-break:break-all}button{margin-top:10px;padding:9px 12px;border:0;border-radius:5px}</style>
</head><body><div class="box"><h2>Barcode Scanner</h2><div id="reader"></div><div id="result">Arahkan kamera ke barcode...</div><button onclick="back()">Kembali</button></div>
<script>
const mode=new URLSearchParams(location.search).get("mode")||"add";let scanner=null,done=false;
function back(){if(window.opener&&!window.opener.closed)window.close();else history.back()}
function start(cameras){
 if(!cameras.length){$("result").textContent="Kamera tidak ditemukan.";return}
 const cam=cameras.find(c=>/back|rear|environment|belakang/i.test(c.label))||cameras[cameras.length-1];
 scanner=new Html5Qrcode("reader");
 scanner.start(cam.id,{fps:10,qrbox:{width:280,height:130}},text=>{
  if(done)return;done=true;$("result").textContent="Barcode: "+text;
  if(window.opener&&!window.opener.closed){
   window.opener.postMessage({type:"ASSET_BARCODE",barcode:text,mode:mode},"*");
   scanner.stop().catch(()=>{}).finally(()=>setTimeout(()=>window.close(),700));
  }else $("result").textContent="Scanner harus dibuka dari aplikasi IT Asset Management.";
 },()=>{}).catch(e=>$("result").textContent="Gagal membuka kamera: "+e);
}
function $(id){return document.getElementById(id)}
Html5Qrcode.getCameras().then(start).catch(e=>$("result").textContent="Tidak bisa mengakses kamera: "+e);
</script></body></html>
